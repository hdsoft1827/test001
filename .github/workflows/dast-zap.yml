name: DAST - ZAP Baseline

on:
    workflow_dispatch:
    schedule:
        - cron: '0 18 * * *'   # 매일 03:00 KST
    push:
        branches: [ main ]

jobs:
    zap-baseline:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v4 
            - name: ZAP Baseline Scan
              uses: zaproxy/action-baseline@v2.12.0
              with:
                target: https://${{ secrets.DOMAIN }}
                rules_file_name: .zap/rules.tsv
                cmd_options: |
                  -n 5        # passive 수
                  -a          # alpha 포함(원치 않으면 거기)
                allow_issue_writing: false
                artifact_name: zap-scan  # 업로드할 아티팩트 이름
                fail_on_error: false      # 긴급도 = true   
            # HTML/JSON 코드도 연습이 자동으로 테이크로 저장.
            # -> 빈 SARIF 올리기 스텝:
            - name: Upload empty SARIF (optional placeholder)
              uses: github/codeql-action/upload-sarif@v3
              with:
                sarif_file: .github/empty.sarif