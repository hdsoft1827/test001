<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Movie Detail</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="header">
  <a href="{{ url_for('home') }}" class="back-btn">← 목록</a>
  <h1>Movie Detail 🎬</h1>
  <a href="{{ url_for('logout') }}" class="logout-btn">로그아웃</a>
</header>

<div class="container">

  <div id="movie-detail" class="detail-card"></div>

  <div class="rating-summary">
    평균 평점: ⭐ {{ avg_rating }} / 5
  </div>

  <div class="comment-section">
    <h3>리뷰 작성</h3>

    <form method="POST" class="comment-form">

      <div class="star-input">
        {% for i in range(1,6) %}
          <input type="radio" name="rating" value="{{ i }}" id="star{{ i }}" required>
          <label for="star{{ i }}">★</label>
        {% endfor %}
      </div>

      <input type="text" name="comment" placeholder="리뷰를 작성하세요" required>
      <button type="submit">등록</button>
    </form>

    <h3>댓글 목록</h3>
    <ul class="comment-list">
      {% for c in comments %}
        <li>
          <div class="comment-rating">
            ⭐ {{ c.rating }} / 5
          </div>
          <div>{{ c.text }}</div>
        </li>
      {% endfor %}
    </ul>
  </div>

</div>

<script src="{{ url_for('static', filename='js/movies.js') }}"></script>
<script src="{{ url_for('static', filename='js/detail.js') }}"></script>

</body>
</html>
