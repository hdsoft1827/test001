<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Movie Detail</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="header">
  <a href="{{ url_for('home') }}" class="back-btn">← 목록</a>
  <h1>Movie Detail 🎬</h1>
  <a href="{{ url_for('logout') }}" class="logout-btn">로그아웃</a>
</header>

<div class="container">

  <div id="movie-detail" class="detail-card"></div>

  <div class="average-rating">
    평균 평점: ⭐ {{ avg_rating }}
  </div>

  <div class="comment-section">
    <h3>리뷰 작성</h3>

    <form method="POST" class="comment-form">

      <!-- 클릭형 별점 -->
      <div class="star-rating">
        <input type="hidden" name="rating" id="rating" required>

        <span data-value="1">★</span>
        <span data-value="2">★</span>
        <span data-value="3">★</span>
        <span data-value="4">★</span>
        <span data-value="5">★</span>
      </div>

      <input type="text" name="comment" placeholder="리뷰를 작성하세요" required>
      <button type="submit">등록</button>
    </form>

    <h3>댓글 목록</h3>

    <ul class="comment-list">
      {% for c in comments %}
      <li>
        <div class="rating">
          {{ "⭐" * c.rating }}
        </div>
        <div class="comment-text">
          {{ c.text }}
        </div>
      </li>
      {% endfor %}
    </ul>

  </div>
</div>

<script src="{{ url_for('static', filename='js/movies.js') }}"></script>
<script src="{{ url_for('static', filename='js/detail.js') }}"></script>

<script>
  const stars = document.querySelectorAll('.star-rating span');
  const ratingInput = document.getElementById('rating');

  stars.forEach(star => {
    star.addEventListener('click', () => {
      const value = star.getAttribute('data-value');
      ratingInput.value = value;

      stars.forEach(s => s.classList.remove('selected'));

      for (let i = 0; i < value; i++) {
        stars[i].classList.add('selected');
      }
    });
  });
</script>

</body>
</html>
