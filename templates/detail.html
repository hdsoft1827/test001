<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Movie Detail</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
  <h1>Movie Detail 🎬</h1>
  <a href="{{ url_for('home') }}">← 목록으로</a>
  <a href="{{ url_for('logout') }}" style="float:right;">로그아웃</a>
</header>

<main id="movie-detail"></main>

<hr>

<h3>리뷰 작성</h3>

<form method="POST">
  <input type="text" name="comment" placeholder="리뷰를 작성하세요" required>
  <button type="submit">등록</button>
</form>

<h3>댓글 목록</h3>
<ul>
  {% for c in comments %}
    <li>{{ c }}</li>
  {% endfor %}
</ul>

<script src="{{ url_for('static', filename='js/movies.js') }}"></script>
<script src="{{ url_for('static', filename='js/detail.js') }}"></script>

</body>
</html>
